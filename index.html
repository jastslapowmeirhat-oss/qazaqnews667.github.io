    /* =========================================
       ПЕРЕМЕННЫЕ
    ========================================= */

    let currentCategory = "Все";
    let currentSearch = "";


    /* =========================================
       LOCAL STORAGE
    ========================================= */

    function getUsers() {

        const users = localStorage.getItem("users");

        if (users) {
            return JSON.parse(users);
        }

        return [];
    }


    function getCurrentUser() {

        const user = localStorage.getItem("currentUser");

        if (user) {
            return JSON.parse(user);
        }

        return null;
    }


    function getFavorites() {

        const favorites = localStorage.getItem("favorites");

        if (favorites) {
            return JSON.parse(favorites);
        }

        return [];
    }


    /* =========================================
       ГЛАВНАЯ СТРАНИЦА
    ========================================= */

    function showHome() {

        event?.preventDefault();

        document.getElementById("app").innerHTML = `

            <section class="hero">

                <h1>Последние новости</h1>

                <p>
                    Новости Казахстана, мира, спорта,
                    технологий и автомобилей.
                </p>

            </section>


            <div class="search-box">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Поиск новостей..."
                    oninput="searchNews()"
                >

            </div>


            <div class="categories">

                <button
                    class="category-button active"
                    onclick="selectCategory('Все')"
                >
                    Все
                </button>

                <button
                    class="category-button"

    /* =========================================
       ВЫВОД НОВОСТЕЙ
    ========================================= */

    function renderNews() {

        let filteredNews = articles.filter(function(article) {

            const categoryMatch =
                currentCategory === "Все" ||
                article.category === currentCategory;

            const searchMatch =
                article.title
                    .toLowerCase()
                    .includes(currentSearch.toLowerCase()) ||

                article.description
                    .toLowerCase()
                    .includes(currentSearch.toLowerCase());

            return categoryMatch && searchMatch;

        });


        const newsList =
            document.getElementById("newsList");

        if (!newsList) {
            return;
        }


        document.getElementById("newsCount").textContent =
            "Найдено: " + filteredNews.length;


        if (filteredNews.length === 0) {

            newsList.innerHTML = `
                <div class="empty">
                    <h3>Новости не найдены</h3>
                    <p>Попробуйте изменить запрос.</p>
                </div>
            `;

            return;
        }


        newsList.innerHTML = "";


        filteredNews.forEach(function(article) {

            const favorites = getFavorites();

            const isFavorite =
                favorites.includes(article.id);


            const card = document.createElement("div");

            card.className = "news-card";


            card.innerHTML = `

                <img
                    class="news-image"
                    src="${article.image}"
                    alt="${article.title}"
                >


                <div class="news-content">

                    <span class="news-category">
                        ${article.category}
                    </span>


                    <h3 class="news-title">
                        ${article.title}
                    </h3>


                    <p class="news-description">
                        ${article.description}
                    </p>


                    <div class="news-date">
                        ${article.date}
                    </div>


                    <div class="news-actions">

                        <button
                            class="read-button"
                            onclick="showArticle(${article.id})"
                        >
                            Читать
                        </button>


                        <button
                            class="favorite-button"
                            onclick="toggleFavorite(${article.id})"
                        >
                            ${isFavorite ? "❤️" : "🤍"}
                        </button>

                    </div>

                </div>
            `;


            newsList.appendChild(card);

        });

    }


    /* =========================================
       КАТЕГОРИЯ
    ========================================= */

    function selectCategory(category) {

        currentCategory = category;

        showHome();

    }


    /* =========================================
       ПОИСК
    ========================================= */

    function searchNews() {

        const input =
            document.getElementById("searchInput");

        if (input) {
            currentSearch = input.value;
        }

        renderNews();

    }


    /* =========================================
       ОТКРЫТИЕ НОВОСТИ
    ========================================= */

    function showArticle(id) {

        const article =
            articles.find(function(item) {
                return item.id === id;
            });


        if (!article) {
            return;
        }


        const favorites = getFavorites();

        const isFavorite =
            favorites.includes(article.id);


        document.getElementById("app").innerHTML = `

            <article class="article-page">

                <button
                    class="back-button"
                    onclick="showHome()"
                >
                    ← Назад
                </button>


                <span class="news-category">
                    ${article.category}
                </span>


                <h1>
                    ${article.title}
                </h1>


                <div class="news-date">
                    ${article.date}
                </div>


                <img
                    src="${article.image}"
                    alt="${article.title}"
                >


                <p class="article-text">
                    ${article.text}
                </p>


                <br>


                <button
                    class="favorite-button"
                    onclick="toggleFavoriteFromArticle(${article.id})"
                >
                    ${isFavorite ? "❤️ Убрать из избранного" : "🤍 Добавить в избранное"}
                </button>

            </article>
        `;

    }


    /* =========================================
       ИЗБРАННОЕ
    ========================================= */

    function toggleFavorite(id) {

        let favorites = getFavorites();


        if (favorites.includes(id)) {

            favorites =
                favorites.filter(function(item) {
                    return item !== id;
                });

        } else {

            favorites.push(id);

        }


        localStorage.setItem(
            "favorites",
            JSON.stringify(favorites)
        );


        renderNews();

    }


    function toggleFavoriteFromArticle(id) {

        let favorites = getFavorites();


        if (favorites.includes(id)) {

            favorites =
                favorites.filter(function(item) {
                    return item !== id;
                });

        } else {

            favorites.push(id);

        }


        localStorage.setItem(
            "favorites",
            JSON.stringify(favorites)
        );


        showArticle(id);

    }


    /* =========================================
       РЕГИСТРАЦИЯ
    ========================================= */

    function showRegister() {

        document.getElementById("app").innerHTML = `

            <div class="auth-container">

                <h2>Регистрация</h2>


                <form onsubmit="register(event)">

                    <div class="form-group">

                        <label>
                            Имя
                        </label>

                        <input
                            type="text"
                            id="regName"
                            placeholder="Введите имя"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Email
                        </label>

                        <input
                            type="email"
                            id="regEmail"
                            placeholder="Введите email"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Пароль
                        </label>

                        <input
                            type="password"
                            id="regPassword"
                            placeholder="Минимум 6 символов"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Повторите пароль
                        </label>

                        <input
                            type="password"
                            id="regPassword2"
                            placeholder="Повторите пароль"
                            required
                        >

                    </div>


                    <button
                        class="submit-button"
                        type="submit"
                    >
                        Зарегистрироваться
                    </button>


                    <div id="registerMessage"></div>

                </form>

            </div>
        `;

    }


    function register(e) {

        e.preventDefault();


        const name =
            document.getElementById("regName").value.trim();

        const email =
            document.getElementById("regEmail").value.trim();

        const password =
            document.getElementById("regPassword").value;

        const password2 =
            document.getElementById("regPassword2").value;


        const message =
            document.getElementById("registerMessage");


        if (password.length < 6) {

            message.innerHTML =
                "Пароль должен содержать минимум 6 символов.";

            return;
        }


        if (password !== password2) {

            message.innerHTML =
                "Пароли не совпадают.";

            return;
        }


        let users = getUsers();


        const exists =
            users.find(function(user) {
                return user.email === email;
            });


        if (exists) {

            message.innerHTML =
                "Пользователь с таким email уже существует.";

            return;
        }


        const newUser = {

            id: Date.now(),

            name: name,

            email: email,

            password: password,

            date: new Date().toLocaleDateString()

        };


        users.push(newUser);


        localStorage.setItem(
            "users",
            JSON.stringify(users)
        );


        message.innerHTML =
            "Регистрация успешна!";


        setTimeout(function() {

            showLogin();

        }, 1000);

    }


    /* =========================================
       ВХОД
    ========================================= */

    function showLogin() {

        document.getElementById("app").innerHTML = `

            <div class="auth-container">

                <h2>Вход</h2>


                <form onsubmit="login(event)">

                    <div class="form-group">

                        <label>
                            Email
                        </label>

                        <input
                            type="email"
                            id="loginEmail"
                            placeholder="Введите email"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Пароль
                        </label>

                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Введите пароль"
                            required
                        >

                    </div>


                    <button
                        class="submit-button"
                        type="submit"
                    >
                        Войти
                    </button>


                    <div id="loginMessage"></div>

                </form>

            </div>
        `;

    }


    function login(e) {

        e.preventDefault();


        const email =
            document.getElementById("loginEmail").value.trim();

        const password =
            document.getElementById("loginPassword").value;


        const users = getUsers();


        const user =
            users.find(function(user) {

                return user.email === email &&
                       user.password === password;

            });


        const message =
            document.getElementById("loginMessage");


        if (!user) {

            message.innerHTML =
                "Неверный email или пароль.";

            return;
        }


        localStorage.setItem(
            "currentUser",
            JSON.stringify(user)
        );


        showProfile();

    }


    /* =========================================
       ПРОФИЛЬ
    ========================================= */

    function showProfile() {

        const user = getCurrentUser();


        if (!user) {

            document.getElementById("app").innerHTML = `

                <div class="auth-container">

                    <h2>Профиль</h2>

                    <p>
                        Вы не авторизованы.
                    </p>

                    <br>

                    <button
                        class="submit-button"
                        onclick="showLogin()"
                    >
                        Войти
                    </button>

                </div>

            `;

            return;
        }


        const favorites = getFavorites();


        const favoriteArticles =
            articles.filter(function(article) {

                return favorites.includes(article.id);

            });


        let favoritesHTML = "";


        if (favoriteArticles.length === 0) {

            favoritesHTML =
                "<p>Избранных новостей пока нет.</p>";

        } else {

            favoriteArticles.forEach(function(article) {

                favoritesHTML += `

                    <div
                        style="
                            padding:15px;
                            border-bottom:1px solid #ddd;
                        "
                    >

                        <h3>
                            ${article.title}
                        </h3>

                        <p>
                            ${article.category}
                        </p>

                        <br>

                        <button
                            class="read-button"
                            onclick="showArticle(${article.id})"
                        >
                            Читать
                        </button>

                    </div>

                `;

            });

        }


        document.getElementById("app").innerHTML = `

            <div class="profile">

                <h1>Профиль</h1>


                <div class="profile-info">

                    <p>
                        <strong>Имя:</strong>
                        ${user.name}
                    </p>

                    <p>
                        <strong>Email:</strong>
                        ${user.email}
                    </p>

                    <p>
                        <strong>Дата регистрации:</strong>
                        ${user.date}
                    </p>

                </div>


                <button
                    class="logout-button"
                    onclick="logout()"
                >
                    Выйти
                </button>


                <br><br>


                <h2>
                    Избранные новости
                </h2>


                <br>


                ${favoritesHTML}

            </div>

        `;

    }


    /* =========================================
       ВЫХОД
    ========================================= */

    function logout() {

        localStorage.removeItem("currentUser");

        showHome();

    }


    /* =========================================
       ТЁМНАЯ ТЕМА
    ========================================= */

    function toggleTheme() {

        document.body.classList.toggle("dark");


        if (document.body.classList.contains("dark")) {

            localStorage.setItem(
                "theme",
                "dark"
            );

        } else {

            localStorage.setItem(
                "theme",
                "light"
            );

        }

    }


    /* =========================================
       ПАНЕЛЬ ПОЛЬЗОВАТЕЛЯ
    ========================================= */

    function updateUserPanel() {

        const panel =
            document.getElementById("userPanel");

        const user =
            getCurrentUser();


        if (!panel) {
            return;
        }


        if (user) {

            panel.innerHTML = `

                <button
                    id="themeButton"
                    onclick="toggleTheme()"
                >
                    🌙
                </button>

                <button
                    onclick="showProfile()"
                >
                    👤 ${user.name}
                </button>

                <button
                    class="register"
                    onclick="logout()"
                >
                    Выйти
                </button>

            `;

        }

    }


    /* =========================================
       ЗАПУСК САЙТА
    ========================================= */

    window.onload = function() {

        const savedTheme =
            localStorage.getItem("theme");


        if (savedTheme === "dark") {

            document.body.classList.add("dark");

        }


        showHome();

        updateUserPanel();

    };

</script>
